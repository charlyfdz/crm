services:
  agent:
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 90s
    profiles: [agent]
    image: crm-agent:${CRM_VERSION:?Set an immutable release identifier}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: agent
      args:
        NODE_IMAGE: ${CRM_NODE_IMAGE:-node:22-bookworm-slim}
        BUN_IMAGE: ${CRM_BUN_IMAGE:-oven/bun:1.3.12-debian}
    mem_limit: ${CRM_AGENT_MEMORY_LIMIT:?Set an approved measured limit}
    cpus: ${CRM_AGENT_CPU_LIMIT:?Set an approved measured limit}
    environment:
      NODE_ENV: production
      POSTGRES_USER: ${CRM_DB_USER:?Set a separate application database role}
      POSTGRES_DB: ${POSTGRES_DB:?Set the installation database name}
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:?Generate a new application database password}
      API_URL: ${API_URL:?Set the API origin}
      APP_URL: ${APP_URL:?Set the application origin}
      CRM_AI_ENABLED: ${CRM_AI_ENABLED:-false}
      CRM_TELEMETRY_DISABLED: "1"
      CRM_TELEMETRY_ENABLED: "false"
      DO_NOT_TRACK: "1"
      AGENT_URL: http://agent:2000
      AGENT_BRIDGE_SECRET: ${AGENT_BRIDGE_SECRET:?Generate a new agent bridge secret}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      PORT: "2000"
      AGENT_PORT: "2000"
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, application]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, node, /workspace/deploy/scripts/health.mjs, agent]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
