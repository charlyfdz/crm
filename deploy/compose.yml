name: ${COMPOSE_PROJECT_NAME:?Set a unique installation name}

x-build: &build
  context: ..
  dockerfile: deploy/Dockerfile
  args:
    NODE_IMAGE: ${CRM_NODE_IMAGE:-node:22-bookworm-slim}
    BUN_IMAGE: ${CRM_BUN_IMAGE:-oven/bun:1.3.12-debian}
    POSTGRES_IMAGE: ${CRM_POSTGRES_IMAGE:-postgres:17-bookworm}
    REDIS_IMAGE: ${CRM_REDIS_IMAGE:-redis:7.4-bookworm}

x-runtime: &runtime
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 90s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-database: &database
  POSTGRES_USER: ${POSTGRES_USER:?Set the installation database owner}
  POSTGRES_DB: ${POSTGRES_DB:?Set the installation database name}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a new database password}

x-application: &application
  <<: *database
  POSTGRES_USER: ${CRM_DB_USER:?Set a separate application database role}
  POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:?Generate a new application database password}
  NODE_ENV: production
  API_URL: ${API_URL:?Set the browser and server API origin}
  APP_URL: ${APP_URL:?Set the application origin}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Generate a new auth secret}
  ALLOWED_SIGN_IN: ${ALLOWED_SIGN_IN:?Set the installation sign-in allowlist}
  CRON_SECRET: ${CRON_SECRET:?Generate a new cron secret}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  CRM_TELEMETRY_DISABLED: "1"
  CRM_TELEMETRY_ENABLED: "false"
  CRM_AI_ENABLED: ${CRM_AI_ENABLED:-false}
  DO_NOT_TRACK: "1"
  IS_MARKETING: "false"
  AGENT_URL: ${AGENT_URL:-}
  AGENT_BRIDGE_SECRET: ${AGENT_BRIDGE_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_POOL_CONNECTION_TIMEOUT_MS: ${DATABASE_POOL_CONNECTION_TIMEOUT_MS:-10000}
  DATABASE_POOL_IDLE_TIMEOUT_MS: ${DATABASE_POOL_IDLE_TIMEOUT_MS:-30000}
  DATABASE_POOL_MAX_LIFETIME_SECONDS: ${DATABASE_POOL_MAX_LIFETIME_SECONDS:-1800}
  DATABASE_POOL_KEEPALIVE_INITIAL_DELAY_MS: ${DATABASE_POOL_KEEPALIVE_INITIAL_DELAY_MS:-10000}

services:
  postgres:
    image: crm-postgres:${CRM_VERSION:?Set an immutable release identifier}
    build:
      <<: *build
      target: postgres
    restart: unless-stopped
    stop_grace_period: 90s
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${CRM_POSTGRES_MEMORY_LIMIT:?Set an approved measured limit}
    cpus: ${CRM_POSTGRES_CPU_LIMIT:?Set an approved measured limit}
    environment:
      <<: *database
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      CRM_DB_USER: ${CRM_DB_USER:?Set a separate application database role}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:?Generate a new application database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    <<: *runtime
    image: crm-redis:${CRM_VERSION:?Set an immutable release identifier}
    build:
      <<: *build
      target: redis
    user: redis
    mem_limit: ${CRM_REDIS_MEMORY_LIMIT:?Set an approved measured limit}
    cpus: ${CRM_REDIS_CPU_LIMIT:?Set an approved measured limit}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate a new Redis password}
      CRM_REDIS_MAXMEMORY: ${CRM_REDIS_MAXMEMORY:?Set a cache limit below its container limit}
    entrypoint: [sh, /opt/crm/redis.sh]
    volumes:
      - redis-data:/data
    tmpfs: [/tmp]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 6

  migrate:
    <<: *runtime
    restart: "no"
    profiles: [tools]
    mem_limit: ${CRM_MIGRATE_MEMORY_LIMIT:?Set an approved measured limit}
    cpus: ${CRM_MIGRATE_CPU_LIMIT:?Set an approved measured limit}
    image: crm-migrate:${CRM_VERSION:?Set an immutable release identifier}
    build:
      <<: *build
      target: migrate
    environment:
      <<: *database
      CRM_DB_USER: ${CRM_DB_USER:?Set a separate application database role}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  api:
    <<: *runtime
    image: crm-api:${CRM_VERSION:?Set an immutable release identifier}
    build:
      <<: *build
      target: api
    mem_limit: ${CRM_API_MEMORY_LIMIT:?Set an approved measured limit}
    cpus: ${CRM_API_CPU_LIMIT:?Set an approved measured limit}
    environment:
      <<: *application
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate a new Redis password}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-60000}
      PORT: "3001"
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["3001"]
    networks: [data, application]
    healthcheck:
      test: [CMD, node, /workspace/deploy/scripts/health.mjs, api]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  app:
    <<: *runtime
    image: crm-app:${CRM_VERSION:?Set an immutable release identifier}
    build:
      <<: *build
      target: app
      args:
        NODE_IMAGE: ${CRM_NODE_IMAGE:-node:22-bookworm-slim}
        BUN_IMAGE: ${CRM_BUN_IMAGE:-oven/bun:1.3.12-debian}
        API_URL: ${API_URL:?Set the browser and server API origin}
        APP_URL: ${APP_URL:?Set the application origin}
    mem_limit: ${CRM_APP_MEMORY_LIMIT:?Set an approved measured limit}
    cpus: ${CRM_APP_CPU_LIMIT:?Set an approved measured limit}
    environment:
      <<: *application
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    expose: ["3000"]
    networks: [data, application]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, /workspace/deploy/scripts/health.mjs, app]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  cron:
    <<: *runtime
    image: crm-cron:${CRM_VERSION:?Set an immutable release identifier}
    build:
      <<: *build
      target: cron
    mem_limit: ${CRM_CRON_MEMORY_LIMIT:?Set an approved measured limit}
    cpus: ${CRM_CRON_CPU_LIMIT:?Set an approved measured limit}
    environment:
      CRON_SECRET: ${CRON_SECRET:?Generate a new cron secret}
      CRM_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    networks: [application]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, node, /workspace/deploy/scripts/health.mjs, cron]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  data:
    internal: true
  application: {}

volumes:
  postgres-data: {}
  redis-data: {}
